<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clases de Manejo Tuc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="stylesheet" href="/css/style.css">

</head>
<body>

<!-- ============ PUBLIC SITE ============ -->
<div id="public-view">

  <header class="site">
    <div class="navbar">
      <div class="brand"><span class="dot"></span>Clases de Manejo Tuc</div>
      <button class="cta-btn top-reserve" onclick="goPublic('reservas')">Reservar ahora</button>
      <button class="nav-toggle" id="nav-toggle-btn" onclick="toggleMobileNav()" aria-label="Abrir menú">☰</button>
      <nav class="links" id="pub-nav"></nav>
    </div>
    <div class="laneline"></div>
  </header>

  <main id="pub-sections"></main>

  <a class="wa-float hidden" id="wa-float-btn" href="#" target="_blank" title="Escribinos por WhatsApp">
    <svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.3 8.6 3.3 15.5c0 2.5.7 4.8 1.9 6.8L3 29l6.9-2.1c1.9 1 4 1.6 6.1 1.6 7 0 12.7-5.6 12.7-12.5C28.7 8.6 23 3 16 3zm0 22.8c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.1 1.2 1.2-4-.3-.4a10.3 10.3 0 0 1-1.7-5.4C5.4 9.7 10.1 5 16 5s10.6 4.7 10.6 10.5S21.9 25.8 16 25.8zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-2.6-1.6 9.7 9.7 0 0 1-1.8-2.2c-.2-.3 0-.5.1-.7l.5-.6.3-.5c.1-.2 0-.4 0-.5s-.7-1.7-1-2.3-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4a3.5 3.5 0 0 0-1.1 2.6c0 1.5 1.1 3 1.3 3.2s2.2 3.4 5.3 4.7c.7.3 1.3.5 1.8.6.7.2 1.4.2 1.9.1.6-.1 1.9-.8 2.2-1.5s.3-1.4.2-1.5-.3-.2-.6-.3z"/></svg>
  </a>

  <footer class="site">
    <div class="wrap">
      <span>© <span id="year"></span> Clases de Manejo Tuc — San Miguel de Tucumán</span>
      <button class="link" onclick="openAdmin()">Acceso administrador</button>
    </div>
  </footer>
</div>

<!-- ============ ADMIN ============ -->
<div id="admin-view" class="hidden">
  <div id="admin-login-screen" class="admin-login">
    <div class="box">
      <div class="eyebrow">Panel interno</div>
      <h2>Ingresar</h2>
      <p style="color:var(--ink-soft);font-size:14px;">Acceso exclusivo para la dueña del emprendimiento.</p>
      <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="field"><label>Usuario</label><input id="login-user" value="profe" required></div>
        <div class="field"><label>Contraseña</label><input id="login-pass" type="password" required placeholder="•••••••••"></div>
        <div id="login-error" class="error-box hidden">Usuario o contraseña incorrectos.</div>
        <button class="cta-btn" style="width:100%;margin-top:6px;" type="submit">Ingresar</button>
      </form>
      <button class="link" style="background:none;border:none;color:var(--ink-soft);text-decoration:underline;margin-top:10px;font-family:'Source Serif 4',serif;" onclick="closeAdmin()">Volver al sitio</button>
    </div>
  </div>

  <div id="admin-dashboard-screen" class="hidden">
    <div class="admin-top">
      <div class="wrap">
        <div class="brand"><span class="dot"></span>Panel — Clases de Manejo Tuc</div>
        <div style="display:flex;gap:10px;">
          <button class="cta-btn ghost small" onclick="closeAdmin()">Ver sitio público</button>
          <button class="cta-btn small" onclick="logoutAdmin()">Cerrar sesión</button>
        </div>
      </div>
    </div>
    <div class="admin-shell">
      <div class="admin-nav" id="admin-nav"></div>
      <div class="admin-main" id="admin-main"></div>
    </div>
  </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
